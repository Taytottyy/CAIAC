name: Refresh feed

on:
  schedule:
    - cron: "0 13 * * *" # daily, 9am US Eastern (8am in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html posts.json
          git diff --cached --quiet || (git commit -m "Refresh feed $(date -u +%F)" && git push)
