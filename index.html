* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.35 }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--rule);

main { max-width: 720px; min-width: 0; padding-top: 40px }

.src { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); text-align: center; line-height: 1.1 }
.ttl { font-family: var(--serif); font-size: 16.9px; color: var(--ink); min-width: 0; line-height: 1.3 }

.right { display: flex; gap: 14px; color: var(--ink-3); font-size: 14px; white-space: nowrap }

.more { all: unset; cursor: pointer; display: block; margin-top: 14px; font-size: 14px; color: var(--green) }

.sources h2 { font-family: var(--serif); font-weight: 500; font-size: 18px; margin: 0 0 4px }
.sources a { color: var(--green) }
.sources a:hover { text-decoration: underline }

  .bar-links a:first-child { display: none }

const UPDATED = "2026-10-28";
const SOURCES = [
  { name: "AI Safety Newsletter", ab: "AISN", who: "CAIS", url: "https://newsletter.safe.ai/" },
  { name: "Don't Worry About the Vase", ab: "Zvi", who: "Zvi", url: "https://thezvi.substack.com/" },
  { name: "The Power Law", ab: "Power Law", who: "P. Wildeford", url: "https://blog.peterwildeford.com/" },
  { name: "AI Safety Papers", ab: "Papers", who: "Papers digest", url: "https://onexerxes.substack.com/" },
  { name: "Hyperdimensional", ab: "Hyper­dim", who: "Dean Ball", url: "https://www.hyperdimensional.co/" },
];
const SRC = Object.fromEntries(SOURCES.map(s => [s.name, s]));
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const day = d => new Date(d + "T12:00:00Z").getTime();
const NOW = day(UPDATED);
const age = d => { const n = Math.round((NOW - day(d)) / 864e5); return n < 1 ? "today" : n < 7 ? n + "d" : n < 60 ? Math.round(n / 7) + "w" : Math.round(n / 30) + "mo"; };
const fmt = d => `${+d.slice(8)} ${MON[+d.slice(5, 7) - 1].slice(0, 3)} ${d.slice(0, 4)}`;
const clean = p => { const t = p.source === "AI Safety Newsletter" ? p.title.replace(/^(AI Safety Newsletter|AISN)\s*#\d+:\s*/, "") : p.title; return t[0].toUpperCase() + t.slice(1); };
const isNotable = p => p.source === "AI Safety Newsletter";

// posts since last visit get a dot
let lastVisit = null;
try { lastVisit = localStorage.getItem("caiac-last"); localStorage.setItem("caiac-last", UPDATED); } catch (e) {}
const isNew = p => lastVisit && p.date > lastVisit;

const weekAgo = POSTS.filter(p => NOW - day(p.date) <= 7 * 864e5).length;
$("#meta").innerHTML = `Updated <b>${fmt(UPDATED)}</b> · ${weekAgo} new this week · ${POSTS.length} posts from ${SOURCES.length} sources`;

$("#notable-list").innerHTML = POSTS.filter(isNotable).slice(0, 5).map(p =>
  `<li><a href="${esc(p.url)}" target="_blank" rel="noopener" data-u="${esc(p.url)}">${esc(clean(p))}</a><span>${age(p.date)}</span></li>`).join("");

const active = new Set(["all"]);
const sorts = $("#sorts");
[{ k: "all", l: "All" }, { k: "notable", l: "Notable" }, ...SOURCES.map(s => ({ k: s.name, l: s.ab.replace("­", "") }))].forEach(o => {
  const b = document.createElement("button");
  b.textContent = o.l; b.id = "f-" + o.k.replace(/\W/g, ""); b.setAttribute("aria-pressed", o.k === "all");
  b.onclick = () => { active.clear(); active.add(o.k); sorts.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); showAll = false; render(); };
  sorts.append(b);
});

let showAll = false;
function render() {
  const k = [...active][0];
  const list = POSTS.filter(p => k === "all" || (k === "notable" ? isNotable(p) : p.source === k));
  const shown = showAll ? list : list.slice(0, 40);
  const groups = [];
  shown.forEach(p => { const m = p.date.slice(0, 7); if (!groups.length || groups.at(-1).m !== m) groups.push({ m, ps: [] }); groups.at(-1).ps.push(p); });
  $("#feed").innerHTML = groups.map(g => `<section class="month" id="m-${g.m}"><h3>${MON[+g.m.slice(5) - 1]} ${g.m.slice(0, 4)}</h3>
    ${g.ps.map(p => { const s = SRC[p.source]; return `<div class="row"><span class="src">${s.ab}</span>
      <a class="ttl" href="${esc(p.url)}" target="_blank" rel="noopener" data-u="${esc(p.url)}">${esc(clean(p))}${isNotable(p) ? `<span class="star" title="Notable">★</span>` : ""}${isNew(p) ? `<span class="new" title="New since your last visit"></span>` : ""}</a>
      <span class="right"><span class="who">${esc(s.who)}</span><span>${age(p.date)}</span></span></div>`; }).join("")}</section>`).join("");
  $("#more").hidden = showAll || shown.length >= list.length;
  $("#toc").innerHTML = groups.map(g => `<a href="#m-${g.m}" data-m="${g.m}"><span>${MON[+g.m.slice(5) - 1].slice(0, 3)} ${g.m.slice(0, 4)}</span><span>${g.ps.length}</span></a>`).join("");
  watchToc();
}
$("#more").onclick = () => { showAll = true; render(); };

let tocObs;
function watchToc() {
  if (!("IntersectionObserver" in window)) return;
  tocObs?.disconnect();
  tocObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("on", a.dataset.m === e.target.id.slice(2))); }), { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".month").forEach(m => tocObs.observe(m));
}

// LessWrong-style hover previews
const BY = Object.fromEntries(POSTS.map(p => [p.url, p]));
const pop = $("#pop");
document.addEventListener("mouseover", e => {
  const a = e.target.closest("[data-u]"); if (!a || !matchMedia("(hover: hover)").matches) return;
  const p = BY[a.dataset.u]; if (!p) return;
  pop.innerHTML = `<span class="m">${esc(p.source)} · ${fmt(p.date)}</span><span class="h">${esc(clean(p))}</span>${p.summary ? `<span class="s">${esc(p.summary)}</span>` : ""}`;
  pop.hidden = false;
  const r = a.getBoundingClientRect();
  let x = Math.min(r.left, innerWidth - pop.offsetWidth - 16), y = r.bottom + 8;
  if (y + pop.offsetHeight > innerHeight - 8) y = r.top - pop.offsetHeight - 8;
  pop.style.left = Math.max(16, x) + "px"; pop.style.top = y + "px";
});
document.addEventListener("mouseout", e => { if (e.target.closest("[data-u]")) pop.hidden = true; });
addEventListener("scroll", () => { pop.hidden = true; }, { passive: true });

$("#src-list").innerHTML = SOURCES.map(s => `<div><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a> · ${esc(s.who)}</div>`).join("") +
  `<div>X lists: <a href="https://x.com/i/lists/1528305432015556608" target="_blank" rel="noopener">@tkrdan</a> · <a href="https://x.com/i/lists/1556976892959498240" target="_blank" rel="noopener">@kubanetics</a></div>`;

render();
</script>
